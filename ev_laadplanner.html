<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>EV Laadplanner</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
  :root {
    --groen: #22c55e;
    --oranje: #f97316;
    --rood: #ef4444;
    --blauw: #3b82f6;
    --donker: #0f172a;
    --donker2: #1e293b;
    --donker3: #334155;
    --tekst: #f1f5f9;
    --subtekst: #94a3b8;
    --accent: #38bdf8;
    --kaart-bg: #1e293b;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; font-family: 'Segoe UI', system-ui, sans-serif; background: var(--donker); color: var(--tekst); overflow: hidden; }

  /* ── SCHERMEN ── */
  .scherm { position: absolute; inset: 0; display: flex; flex-direction: column; transition: transform .35s cubic-bezier(.4,0,.2,1), opacity .35s; }
  .scherm.verborgen { transform: translateX(100%); opacity: 0; pointer-events: none; }

  /* ── HEADER ── */
  .header {
    background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
    padding: 8px 16px 8px;
    display: flex; align-items: center; gap: 10px;
    border-bottom: 1px solid rgba(255,255,255,.08);
    flex-shrink: 0;
  }
  .header h1 { font-size: 16px; font-weight: 700; letter-spacing: -.3px; }
  .header span { font-size: 18px; }
  .header-sub { font-size: 10px; color: var(--subtekst); margin-top: 1px; }
  .header-back { background: rgba(255,255,255,.1); border: none; color: var(--tekst); font-size: 20px; width: 36px; height: 36px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }

  /* ── INSTELLINGEN SCHERM ── */
  #s-instellen { background: var(--donker); }
  .instellen-body { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 12px; }

  .zoek-sticky {
    position: sticky;
    top: 0;
    z-index: 100;
    background: var(--donker);
    padding-bottom: 4px;
    margin: -12px -12px 0;
    padding: 12px 12px 8px;
  }

  .kaart-section {
    background: var(--donker2);
    border-radius: 14px;
    overflow: hidden;
    border: 1px solid rgba(255,255,255,.07);
  }
  .kaart-section-label {
    font-size: 11px; text-transform: uppercase; letter-spacing: .8px;
    color: var(--subtekst); padding: 10px 14px 6px;
  }

  /* ── BESTEMMING INVOER ── */
  .doel-row {
    padding: 0 14px 14px;
    display: flex; gap: 8px;
  }
  .doel-input {
    flex: 1;
    background: var(--donker3);
    border: 1.5px solid rgba(255,255,255,.12);
    border-radius: 10px;
    color: var(--tekst);
    font-size: 15px;
    padding: 11px 14px;
    outline: none;
    transition: border-color .2s;
  }
  .doel-input:focus { border-color: var(--accent); }
  .doel-input::placeholder { color: var(--subtekst); }
  .doel-zoek-btn {
    background: var(--accent);
    border: none; color: #0f172a;
    font-size: 18px; font-weight: 700;
    width: 46px; height: 46px;
    border-radius: 10px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .doel-resultaten {
    margin: 0 14px 10px;
    background: var(--donker3);
    border-radius: 10px;
    overflow: hidden;
    display: none;
  }
  .doel-resultaten.zichtbaar { display: block; }
  .doel-item {
    padding: 10px 14px;
    cursor: pointer;
    border-bottom: 1px solid rgba(255,255,255,.06);
    font-size: 13px;
    line-height: 1.4;
  }
  .doel-item:last-child { border-bottom: none; }
  .doel-item:hover, .doel-item:active { background: rgba(56,189,248,.12); }
  .doel-item strong { display: block; font-size: 14px; }
  .doel-item span { color: var(--subtekst); font-size: 12px; }

  /* ── SLIDERS ── */
  .slider-card {
    background: var(--donker2);
    border-radius: 14px;
    padding: 14px 16px;
    border: 1px solid rgba(255,255,255,.07);
  }
  .slider-header { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 10px; }
  .slider-label { font-size: 13px; font-weight: 600; }
  .slider-waarde { font-size: 22px; font-weight: 800; color: var(--accent); }
  .slider-waarde small { font-size: 13px; font-weight: 400; color: var(--subtekst); }
  input[type=range] {
    -webkit-appearance: none; width: 100%; height: 6px;
    border-radius: 3px; background: var(--donker3); outline: none;
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; width: 24px; height: 24px;
    border-radius: 50%; background: var(--accent);
    border: 3px solid var(--donker); cursor: pointer;
    box-shadow: 0 0 0 2px rgba(56,189,248,.3);
  }
  .slider-hint { font-size: 11px; color: var(--subtekst); margin-top: 6px; }

  /* ── VERMOGEN TOGGLE ── */
  .vermogen-card {
    background: var(--donker2);
    border-radius: 14px;
    padding: 14px 16px;
    border: 1px solid rgba(255,255,255,.07);
  }
  .vermogen-label { font-size: 13px; font-weight: 600; margin-bottom: 10px; }
  .vermogen-knoppen { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .vermogen-knop {
    background: var(--donker3);
    border: 2px solid rgba(255,255,255,.1);
    border-radius: 10px;
    color: var(--tekst);
    font-size: 14px; font-weight: 700;
    padding: 12px 8px;
    cursor: pointer;
    text-align: center;
    transition: all .15s;
  }
  .vermogen-knop.actief { background: rgba(56,189,248,.15); border-color: var(--accent); color: var(--accent); }
  .vermogen-knop small { display: block; font-size: 11px; font-weight: 400; color: var(--subtekst); margin-top: 2px; }
  .vermogen-knop.actief small { color: rgba(56,189,248,.7); }

  /* ── START KNOP ── */
  .start-btn {
    background: linear-gradient(135deg, #22c55e, #16a34a);
    border: none; color: #fff;
    font-size: 17px; font-weight: 800;
    padding: 16px;
    border-radius: 14px;
    cursor: pointer;
    width: 100%;
    letter-spacing: .3px;
    box-shadow: 0 4px 20px rgba(34,197,94,.3);
    transition: transform .1s, box-shadow .1s;
  }
  .start-btn:active { transform: scale(.98); box-shadow: 0 2px 10px rgba(34,197,94,.2); }
  .start-btn:disabled { background: var(--donker3); color: var(--subtekst); box-shadow: none; cursor: not-allowed; }
  .doel-badge {
    background: rgba(34,197,94,.12);
    border: 1px solid rgba(34,197,94,.3);
    border-radius: 8px;
    padding: 8px 12px;
    font-size: 13px;
    display: none;
    gap: 8px;
    align-items: center;
  }
  .doel-badge.zichtbaar { display: flex; }
  .doel-badge-tekst { flex: 1; }
  .doel-badge-tekst strong { display: block; color: var(--groen); font-size: 14px; }
  .doel-badge-tekst span { color: var(--subtekst); font-size: 12px; }
  .doel-wis { background: none; border: none; color: var(--subtekst); font-size: 18px; cursor: pointer; padding: 0 4px; }

  /* ── RIJDEN SCHERM ── */
  #s-rijden { background: var(--donker); }
  #kaart { flex: 1; background: #1a2332; }

  /* ── RIJDEN HUD ── */
  .hud {
    position: absolute;
    top: 70px; left: 0; right: 0;
    z-index: 1000;
    pointer-events: none;
    padding: 0 12px;
    display: flex; gap: 8px;
  }
  .hud-kaart {
    background: rgba(15,23,42,.88);
    backdrop-filter: blur(8px);
    border-radius: 12px;
    padding: 8px 12px;
    border: 1px solid rgba(255,255,255,.08);
    flex: 1;
  }
  .hud-rij { display: flex; justify-content: space-between; align-items: center; }
  .hud-item { text-align: center; }
  .hud-item .val { font-size: 20px; font-weight: 800; }
  .hud-item .lbl { font-size: 10px; color: var(--subtekst); text-transform: uppercase; letter-spacing: .5px; }
  .hud-item.groen .val { color: var(--groen); }
  .hud-item.oranje .val { color: var(--oranje); }
  .hud-item.rood .val { color: var(--rood); }
  .hud-divider { width: 1px; background: rgba(255,255,255,.1); margin: 4px 0; }

  /* ── STATUS BALK ── */
  .status-balk {
    position: absolute;
    top: 134px; left: 12px; right: 12px;
    z-index: 1000;
    pointer-events: none;
  }
  .status-pill {
    background: rgba(15,23,42,.9);
    backdrop-filter: blur(8px);
    border-radius: 20px;
    padding: 6px 14px;
    font-size: 12px;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    border: 1px solid rgba(255,255,255,.08);
  }
  .status-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .status-dot.groen { background: var(--groen); box-shadow: 0 0 6px var(--groen); }
  .status-dot.oranje { background: var(--oranje); box-shadow: 0 0 6px var(--oranje); }
  .status-dot.rood { background: var(--rood); box-shadow: 0 0 6px var(--rood); animation: puls 1s infinite; }
  @keyframes puls { 0%,100%{ opacity:1; } 50%{ opacity:.4; } }

  /* ── ONDERSTE BALK ── */
  .onderste-balk {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    z-index: 1000;
    padding: 12px 12px 20px;
    background: linear-gradient(to top, rgba(15,23,42,.98) 60%, transparent);
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .laders-preview {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding-bottom: 4px;
    scrollbar-width: none;
  }
  .laders-preview::-webkit-scrollbar { display: none; }

  .lader-chip {
    background: var(--donker2);
    border: 1.5px solid rgba(255,255,255,.1);
    border-radius: 10px;
    padding: 8px 12px;
    cursor: pointer;
    flex-shrink: 0;
    min-width: 140px;
    transition: border-color .15s;
    pointer-events: all;
  }
  .lader-chip:active { border-color: var(--accent); }
  .lader-chip-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px; }
  .lader-chip-naam { font-size: 13px; font-weight: 700; }
  .lader-chip-kw { font-size: 12px; font-weight: 800; color: var(--groen); background: rgba(34,197,94,.12); padding: 1px 6px; border-radius: 5px; }
  .lader-chip-kw.oranje { color: var(--oranje); background: rgba(249,115,22,.12); }
  .lader-chip-info { font-size: 11px; color: var(--subtekst); }
  .lader-chip-faciliteiten { font-size: 11px; margin-top: 3px; }

  .acties-rij { display: flex; gap: 8px; pointer-events: all; }
  .paniek-knop {
    background: linear-gradient(135deg, #ef4444, #b91c1c);
    border: none; color: #fff;
    font-size: 15px; font-weight: 800;
    height: 52px;
    border-radius: 12px;
    cursor: pointer;
    flex: 1;
    display: flex; align-items: center; justify-content: center; gap: 8px;
    box-shadow: 0 4px 20px rgba(239,68,68,.35);
    letter-spacing: .2px;
    transition: transform .1s;
  }
  .paniek-knop:active { transform: scale(.97); }
  .zoek-knop {
    background: linear-gradient(135deg, #3b82f6, #1d4ed8);
    border: none; color: #fff;
    font-size: 15px; font-weight: 700;
    height: 52px; width: 52px;
    border-radius: 12px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-size: 22px;
    box-shadow: 0 4px 16px rgba(59,130,246,.3);
    transition: transform .1s;
  }
  .zoek-knop:active { transform: scale(.97); }
  .instellingen-knop {
    background: var(--donker2);
    border: 1.5px solid rgba(255,255,255,.1);
    color: var(--tekst);
    font-size: 20px;
    height: 52px; width: 52px;
    border-radius: 12px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: transform .1s;
  }
  .instellingen-knop:active { transform: scale(.97); }

  /* ── DETAIL PANEL ── */
  #detail-panel {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    z-index: 2000;
    background: var(--donker2);
    border-radius: 20px 20px 0 0;
    border-top: 1px solid rgba(255,255,255,.1);
    transform: translateY(100%);
    transition: transform .3s cubic-bezier(.4,0,.2,1);
    max-height: 85vh;
    display: flex;
    flex-direction: column;
  }
  #detail-panel.open { transform: translateY(0); }
  .panel-handle { width: 36px; height: 4px; background: rgba(255,255,255,.2); border-radius: 2px; margin: 10px auto 0; flex-shrink: 0; }
  .panel-body { overflow-y: auto; padding: 12px 16px 32px; flex: 1; }
  .panel-naam { font-size: 20px; font-weight: 800; margin-bottom: 4px; }
  .panel-adres { font-size: 13px; color: var(--subtekst); margin-bottom: 12px; }
  .panel-badges { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
  .badge {
    font-size: 12px; font-weight: 700;
    padding: 4px 10px; border-radius: 20px;
  }
  .badge.kw100 { background: rgba(34,197,94,.15); color: var(--groen); border: 1px solid rgba(34,197,94,.3); }
  .badge.kw50 { background: rgba(249,115,22,.15); color: var(--oranje); border: 1px solid rgba(249,115,22,.3); }
  .badge.punten { background: rgba(56,189,248,.15); color: var(--accent); border: 1px solid rgba(56,189,248,.3); }
  .badge.afstand { background: rgba(148,163,184,.1); color: var(--subtekst); border: 1px solid rgba(255,255,255,.1); }

  .panel-sectie { margin-bottom: 16px; }
  .panel-sectie-titel { font-size: 11px; text-transform: uppercase; letter-spacing: .8px; color: var(--subtekst); margin-bottom: 8px; }
  .faciliteit-rij { display: flex; align-items: center; gap: 8px; padding: 6px 0; border-bottom: 1px solid rgba(255,255,255,.05); font-size: 13px; }
  .faciliteit-rij:last-child { border-bottom: none; }
  .faciliteit-icon { font-size: 16px; width: 24px; text-align: center; }
  .faciliteit-afstand { margin-left: auto; color: var(--subtekst); font-size: 12px; }

  .voor-nadeel-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .voordelen, .nadelen {
    background: var(--donker3);
    border-radius: 10px;
    padding: 10px 12px;
  }
  .voordelen { border-top: 3px solid var(--groen); }
  .nadelen { border-top: 3px solid var(--rood); }
  .vn-titel { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; margin-bottom: 6px; }
  .voordelen .vn-titel { color: var(--groen); }
  .nadelen .vn-titel { color: var(--rood); }
  .vn-item { font-size: 12px; color: var(--subtekst); margin-bottom: 3px; line-height: 1.4; }

  .panel-knoppen { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 6px; }
  .panel-btn {
    border: none; border-radius: 11px;
    font-size: 14px; font-weight: 700;
    height: 48px; cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: 6px;
    transition: transform .1s;
  }
  .panel-btn:active { transform: scale(.97); }
  .panel-btn.navigeer { background: linear-gradient(135deg, var(--groen), #16a34a); color: #fff; }
  .panel-btn.plugshare { background: rgba(56,189,248,.15); color: var(--accent); border: 1.5px solid rgba(56,189,248,.3); }
  .panel-sluiten {
    position: absolute; top: 14px; right: 16px;
    background: rgba(255,255,255,.1); border: none;
    color: var(--tekst); width: 30px; height: 30px;
    border-radius: 50%; font-size: 16px;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    z-index: 10;
  }

  /* ── OVERLAY ── */
  #overlay { position: absolute; inset: 0; z-index: 1500; background: rgba(0,0,0,.5); display: none; }
  #overlay.zichtbaar { display: block; }

  /* ── LADEN INDICATOR ── */
  .laden {
    position: absolute; inset: 0; z-index: 3000;
    background: rgba(15,23,42,.85);
    display: none;
    align-items: center; justify-content: center;
    flex-direction: column; gap: 16px;
  }
  .laden.zichtbaar { display: flex; }
  .laden-ring {
    width: 48px; height: 48px;
    border: 4px solid rgba(56,189,248,.2);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .laden-tekst { font-size: 14px; color: var(--subtekst); }

  /* ── TOAST ── */
  #toast {
    position: absolute; bottom: 110px; left: 50%; transform: translateX(-50%) translateY(20px);
    background: rgba(30,41,59,.95); border: 1px solid rgba(255,255,255,.1);
    border-radius: 20px; padding: 8px 16px;
    font-size: 13px; white-space: nowrap;
    z-index: 5000; opacity: 0;
    transition: opacity .3s, transform .3s;
    pointer-events: none;
  }
  #toast.zichtbaar { opacity: 1; transform: translateX(-50%) translateY(0); }

  .laad-slider-balk {
    background: rgba(15,23,42,.92);
    backdrop-filter: blur(8px);
    border: 1px solid rgba(255,255,255,.1);
    border-radius: 12px;
    padding: 10px 12px 6px;
    pointer-events: all;
  }
  .laad-slider-header {
    display: flex; align-items: center; gap: 6px;
    font-size: 13px; color: var(--subtekst);
    margin-bottom: 6px;
  }
  .laad-slider-header strong { font-size: 20px; color: var(--accent); min-width: 36px; text-align:center; }
  .zoek-nu-btn {
    margin-left: auto;
    background: var(--accent); border: none;
    color: #0f172a; font-size: 13px; font-weight: 800;
    padding: 5px 12px; border-radius: 8px; cursor: pointer;
  }
  .laad-slider-schaal {
    display: flex; justify-content: space-between;
    font-size: 10px; color: rgba(255,255,255,.25);
    margin-top: 2px; padding: 0 2px;
  }

  /* ── CATEGORIE CHIPS ── */
  .laders-categorie { flex-shrink: 0; }
  .categorie-titel {
    font-size: 10px; text-transform: uppercase; letter-spacing: .6px;
    color: var(--subtekst); padding: 4px 2px 2px;
  }
  .lader-chip.eerder { border-color: rgba(148,163,184,.3); }
  .lader-chip.opdoel { border-color: var(--groen); }
  .lader-chip.later { border-color: rgba(56,189,248,.3); }
  .lader-chip.omrijd { border-color: var(--oranje); }
  .leaflet-container { background: #1a2332 !important; }
  .lader-marker {
    display: flex; align-items: center; justify-content: center;
    font-size: 20px;
    width: 36px; height: 36px;
    border-radius: 50%;
    border: 3px solid;
    background: var(--donker2);
    cursor: pointer;
    box-shadow: 0 2px 8px rgba(0,0,0,.5);
    transition: transform .15s;
  }
  .lader-marker.kw100 { border-color: var(--groen); }
  .lader-marker.kw50 { border-color: var(--oranje); }
  .lader-marker.laag { border-color: rgba(255,255,255,.3); }

  /* Gps pijl */
  .gps-dot {
    width: 16px; height: 16px;
    background: var(--blauw);
    border-radius: 50%;
    border: 3px solid white;
    box-shadow: 0 0 0 4px rgba(59,130,246,.3);
  }
</style>
</head>
<body>

<!-- ═══════════════════════════════════════ INSTELLEN SCHERM -->
<div id="s-instellen" class="scherm">
  <div class="header">
    <span>⚡</span>
    <div>
      <div class="header h1" style="font-size:18px;font-weight:700">EV Laadplanner</div>
      <div class="header-sub">Stel je reis in</div>
    </div>
  </div>

  <!-- ZOEKBLOK VAST — buiten scrollbare body -->
  <div style="padding:12px 12px 0;background:var(--donker);flex-shrink:0;">
    <div style="background:var(--donker2);border-radius:14px;border:2px solid rgba(56,189,248,.4);overflow:hidden;">
      <div style="font-size:13px;font-weight:700;color:var(--accent);padding:10px 14px 4px">🎯 Waar ga je naartoe?</div>
      <div class="doel-row">
        <input id="doel-input" class="doel-input" type="text" placeholder="Typ bestemming en tik 🔍" autocomplete="off" inputmode="search" style="font-size:16px;padding:12px 14px">
        <button class="doel-zoek-btn" onclick="zoekBestemming()" style="width:52px;height:52px;font-size:22px">🔍</button>
      </div>
      <div id="doel-resultaten" class="doel-resultaten"></div>
      <div id="doel-badge" class="doel-badge" style="margin:0 14px 10px">
        <span style="font-size:20px">📍</span>
        <div class="doel-badge-tekst">
          <strong id="doel-badge-naam">—</strong>
          <span id="doel-badge-adres">—</span>
        </div>
        <button class="doel-wis" onclick="wisDoel()">✕</button>
      </div>
    </div>
  </div>

  <div class="instellen-body">

    <!-- BEREIK SLIDER -->
    <div class="slider-card">
      <div class="slider-header">
        <div class="slider-label">🔋 Huidig bereik</div>

<script>
// ═══════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════
const S = {
  doel: null,           // { naam, adres, lat, lon }
  bereik: 280,          // km
  laadPct: 15,          // %
  radius: 30,           // km
  vermogen: 100,        // kW minimum
  positie: null,        // { lat, lon }
  route: null,          // GeoJSON LineString coördinaten
  laders: [],           // gevonden laders
  gekozenLader: null,
};

// API keys (publiek / gratis tiers)
const OCM_KEY = '745488cb-d680-48df-b690-d11f977f5788'; // OpenChargeMap MarsWes key
const ORS_KEY = '5b3ce3597851110001cf62488e08c24c9f7c4e678b27c8c6b1aa38c1'; // ORS gratis

let kaart = null;
let gpsWatcher = null;
let positieMarker = null;
let routeLaag = null;
let laderMarkers = [];
let paniekMarker = null;

// ═══════════════════════════════════════════
// INSTELLEN SCHERM
// ═══════════════════════════════════════════

function updateSliders() {
  const bereik = +document.getElementById('bereik-slider').value;
  S.bereik = bereik;
  document.getElementById('bereik-val').textContent = bereik;
  document.getElementById('bereik-hint').textContent = bereik;
  localStorage.setItem('ev_s', JSON.stringify({bereik, vermogen: S.vermogen}));
}

function setVermogen(kw) {
  S.vermogen = kw;
  document.querySelectorAll('.vermogen-knop').forEach(b => b.classList.remove('actief'));
  const id = kw === 100 ? 'vk-100' : kw === 50 ? 'vk-50' : 'vk-any';
  document.getElementById(id).classList.add('actief');
  updateSliders();
}

function wisDoel() {
  S.doel = null;
  document.getElementById('doel-input').value = '';
  document.getElementById('doel-badge').classList.remove('zichtbaar');
  document.getElementById('doel-resultaten').classList.remove('zichtbaar');
  document.getElementById('start-btn').disabled = true;
}

async function zoekBestemming() {
  const q = document.getElementById('doel-input').value.trim();
  if (!q) return;
  toonLaden('Zoeken...');
  try {
    const r = await fetch(`https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(q)}&format=json&limit=8&addressdetails=1&featuretype=city&dedupe=1`);
    const data = await r.json();
    verbergLaden();
    toonDoelResultaten(data);
  } catch(e) {
    verbergLaden();
    toast('Zoeken mislukt, controleer verbinding');
  }
}

function toonDoelResultaten(data) {
  const el = document.getElementById('doel-resultaten');
  if (!data.length) {
    el.innerHTML = '<div class="doel-item"><span>Geen resultaten gevonden</span></div>';
    el.classList.add('zichtbaar');
    return;
  }
  el.innerHTML = data.map((d,i) => {
    const naam = d.name || d.display_name.split(',')[0];
    const delen = d.display_name.split(',');
    const land = delen[delen.length - 1].trim();
    const rest = delen.slice(1,3).join(',').trim();
    const info = land !== naam ? `${rest} · ${land}` : rest;
    return `<div class="doel-item" onclick="kiesDoel(${i})">
      <strong>${naam}</strong>
      <span>${info}</span>
    </div>`;
  }).join('');
  el.classList.add('zichtbaar');
  el._data = data;
}

function kiesDoel(i) {
  const data = document.getElementById('doel-resultaten')._data;
  const d = data[i];
  const naam = d.name || d.display_name.split(',')[0];
  const adres = d.display_name.split(',').slice(1,3).join(',').trim();
  S.doel = { naam, adres, lat: +d.lat, lon: +d.lon };
  document.getElementById('doel-badge-naam').textContent = naam;
  document.getElementById('doel-badge-adres').textContent = adres;
  document.getElementById('doel-badge').classList.add('zichtbaar');
  document.getElementById('doel-resultaten').classList.remove('zichtbaar');
  document.getElementById('doel-input').value = '';
  document.getElementById('start-btn').disabled = false;
}

document.getElementById('doel-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') zoekBestemming();
});

// Herstel opgeslagen instellingen
(function herstelInstellingen() {
  try {
    const saved = JSON.parse(localStorage.getItem('ev_s') || '{}');
    if (saved.bereik) { S.bereik = saved.bereik; document.getElementById('bereik-slider').value = saved.bereik; }
    if (saved.vermogen !== undefined) setVermogen(saved.vermogen);
    if (saved.vermogen !== undefined) setVermogen(saved.vermogen);
    updateSliders();
  } catch(e) {}
})();

// ═══════════════════════════════════════════
// NAVIGATIE TUSSEN SCHERMEN
// ═══════════════════════════════════════════

function startRijden() {
  if (!S.doel) return;
  document.getElementById('s-instellen').classList.add('verborgen');
  document.getElementById('s-rijden').classList.remove('verborgen');
  document.getElementById('rij-doel-naam').textContent = S.doel.naam;
  initKaart();
  startGPS();
}

function naarInstellen() {
  document.getElementById('s-rijden').classList.add('verborgen');
  document.getElementById('s-instellen').classList.remove('verborgen');
  sluitPanel();
}

// ═══════════════════════════════════════════
// KAART
// ═══════════════════════════════════════════

function initKaart() {
  if (kaart) return; // al geïnitialiseerd
  kaart = L.map('kaart', {
    zoomControl: false,
    attributionControl: false,
  }).setView([52.1, 5.3], 8);

  L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
    maxZoom: 19,
  }).addTo(kaart);

  // Doel marker
  L.marker([S.doel.lat, S.doel.lon], {
    icon: L.divIcon({
      className: '',
      html: '<div style="font-size:28px;filter:drop-shadow(0 2px 4px rgba(0,0,0,.6))">🏁</div>',
      iconSize: [28, 28], iconAnchor: [14, 28]
    })
  }).addTo(kaart).bindPopup(S.doel.naam);
}

function updatePositieOpKaart(lat, lon) {
  if (!kaart) return;
  const icon = L.divIcon({
    className: '',
    html: '<div class="gps-dot"></div>',
    iconSize: [16, 16], iconAnchor: [8, 8]
  });
  if (!positieMarker) {
    positieMarker = L.marker([lat, lon], { icon, zIndexOffset: 1000 }).addTo(kaart);
  } else {
    positieMarker.setLatLng([lat, lon]);
  }
}

function tekeRouteOpKaart(coords) {
  if (!kaart) return;
  if (routeLaag) kaart.removeLayer(routeLaag);
  routeLaag = L.polyline(coords.map(c => [c[1], c[0]]), {
    color: '#38bdf8', weight: 4, opacity: .6, dashArray: null
  }).addTo(kaart);

  const group = L.featureGroup([routeLaag]);
  if (positieMarker) group.addLayer(positieMarker);
  kaart.fitBounds(group.getBounds().pad(.12));
}

function plaatsLaderMarkers(laders, zoekpunten) {
  laderMarkers.forEach(m => kaart.removeLayer(m));
  laderMarkers = [];
  laders.forEach((l, i) => {
    const cls = l.vermogen >= 100 ? 'kw100' : l.vermogen >= 50 ? 'kw50' : 'laag';
    const icon = L.divIcon({
      className: '',
      html: `<div class="lader-marker ${cls}" onclick="toonDetail(${i})">⚡</div>`,
      iconSize: [36, 36], iconAnchor: [18, 18]
    });
    const m = L.marker([l.lat, l.lon], { icon }).addTo(kaart);
    laderMarkers.push(m);
  });
}

// ═══════════════════════════════════════════
// GPS
// ═══════════════════════════════════════════

function startGPS() {
  if (!navigator.geolocation) {
    // Demo mode: gebruik centrum NL
    simuleerPositie(52.37, 4.9);
    return;
  }
  setStatus('oranje', 'GPS zoeken...');
  gpsWatcher = navigator.geolocation.watchPosition(
    pos => {
      const { latitude: lat, longitude: lon } = pos.coords;
      S.positie = { lat, lon };
      document.getElementById('gps-status').textContent = '✓';
      updatePositieOpKaart(lat, lon);
      berekenRoute();
      updateHUD();
      setStatus('groen', 'Live route actief');
    },
    err => {
      setStatus('oranje', 'GPS niet beschikbaar — demo modus');
      simuleerPositie(52.37, 4.9);
    },
    { enableHighAccuracy: true, maximumAge: 10000 }
  );
}

function simuleerPositie(lat, lon) {
  S.positie = { lat, lon };
  updatePositieOpKaart(lat, lon);
  berekenRoute();
  updateHUD();
  setStatus('groen', 'Demo positie (Amsterdam)');
}

// ═══════════════════════════════════════════
// ROUTE BEREKENING
// ═══════════════════════════════════════════

let routeDebounce = null;
let laatsteRoutePositie = null;

function berekenRoute() {
  if (!S.positie || !S.doel) return;
  
  // Alleen herberekenen als 200m+ verplaatst sinds laatste berekening
  if (laatsteRoutePositie) {
    const verplaatst = afstand(
      S.positie.lat, S.positie.lon,
      laatsteRoutePositie.lat, laatsteRoutePositie.lon
    ) * 1000; // meter
    if (verplaatst < 200) return;
  }
  
  clearTimeout(routeDebounce);
  laatsteRoutePositie = { ...S.positie }; // sla positie op vóór de berekening
  routeDebounce = setTimeout(_berekenRoute, 500);
}

async function _berekenRoute() {
  if (!S.positie || !S.doel) return;
  laatsteRoutePositie = { ...S.positie }; // onthoud positie van deze berekening
  try {
    // OSRM - open source, geen key nodig, betrouwbaar
    const url = `https://router.project-osrm.org/route/v1/driving/${S.positie.lon},${S.positie.lat};${S.doel.lon},${S.doel.lat}?overview=full&geometries=geojson`;
    const r = await fetch(url);
    const data = await r.json();
    if (data.routes && data.routes[0]) {
      const route = data.routes[0];
      S.route = route.geometry.coordinates;
      const dist = route.distance / 1000;
      document.getElementById('rij-doel-afstand').textContent = `${Math.round(dist)} km naar ${S.doel.naam}`;
      document.getElementById('hud-rest').querySelector('.val').textContent = `${Math.round(dist)} km`;
      tekeRouteOpKaart(S.route);
      updateStatusOBVBereik(dist);
      setStatus('groen', `Route geladen — ${Math.round(dist)} km naar ${S.doel.naam}`);
    }
  } catch(e) {
    // Fallback: rechte lijn schatting
    if (S.positie && S.doel) {
      const dist = afstand(S.positie.lat, S.positie.lon, S.doel.lat, S.doel.lon);
      document.getElementById('rij-doel-afstand').textContent = `~${Math.round(dist)} km (schatting)`;
      document.getElementById('hud-rest').querySelector('.val').textContent = `~${Math.round(dist)} km`;
      updateStatusOBVBereik(dist);
      setStatus('oranje', `Route niet beschikbaar — schatting ${Math.round(dist)} km`);
    }
  }
}

function updateStatusOBVBereik(restKm) {
  const laadKm = S.laadKm || 60;
  const haalbaar = S.bereik >= restKm;
  const laadAdvies = !haalbaar || (S.bereik - restKm) < laadKm;
  if (haalbaar && !laadAdvies) {
    setStatus('groen', `Haalbaar ✓ — bereik ${S.bereik} km, ${Math.round(restKm)} km te gaan`);
  } else if (!haalbaar) {
    setStatus('rood', `Bereik tekort! Druk op 🔍 om laders te zoeken`);
  } else {
    setStatus('oranje', `Laadadvies — minder dan ${laadKm} km bereik over na aankomst`);
  }
}

function updateHUD() {
  const hud = document.getElementById('hud-bereik').querySelector('.val');
  hud.textContent = `${S.bereik} km`;
  const laadKm = S.laadKm || 70;
  if (S.bereik > laadKm * 2) hud.style.color = 'var(--groen)';
  else if (S.bereik > laadKm) hud.style.color = 'var(--oranje)';
  else hud.style.color = 'var(--rood)';
  document.getElementById('hud-radius').querySelector('.val').textContent = `${laadKm} km`;
}

// ═══════════════════════════════════════════
// LADERS ZOEKEN
// ═══════════════════════════════════════════

let zoekpuntMarker = null;

// Punt op precies X km langs de route
function vindPuntOpRoute(doelKm) {
  if (!S.route || S.route.length < 2) return null;
  let gelopen = 0;
  for (let i = 0; i < S.route.length - 1; i++) {
    const van = { lat: S.route[i][1], lon: S.route[i][0] };
    const naar = { lat: S.route[i+1][1], lon: S.route[i+1][0] };
    const stap = afstand(van.lat, van.lon, naar.lat, naar.lon);
    if (gelopen + stap >= doelKm) {
      const f = (doelKm - gelopen) / stap;
      return { lat: van.lat + f*(naar.lat-van.lat), lon: van.lon + f*(naar.lon-van.lon) };
    }
    gelopen += stap;
  }
  const last = S.route[S.route.length-1];
  return { lat: last[1], lon: last[0] };
}

async function zoekLaders(paniek = false) {
  if (!S.positie) { toast('Positie nog niet bekend'); return; }
  toonLaden('Laders zoeken langs route...');

  const kw = paniek ? 50 : S.vermogen;

  try {
    if (paniek) {
      const ruw = await haalLadersOpPunt(S.positie, 30, kw, 10);
      const metFac = await voegFaciliteitenToe(ruw);
      S.laders = metFac;
      verbergLaden();
      toonLaderChipsEnkel(metFac);
      plaatsLaderMarkers(metFac, []);
      if (metFac.length > 0) toonDetail(0);
      else toast('Geen laders gevonden binnen 30 km');
      return;
    }

    if (!S.route || S.route.length < 2) {
      toast('Route nog niet berekend — even wachten');
      verbergLaden();
      return;
    }

    const doelKm = S.laadKm || 70;

    // Bounding box: 60km voor t/m 30km na gevraagd punt
    const kmVan = Math.max(0, doelKm - 60);
    const kmTot = doelKm + 30;
    const bb = boundingBox(kmVan, kmTot);

    // Toon zoekpunt op kaart
    const pDoel = vindPuntOpRoute(doelKm);
    if (kaart && pDoel) {
      if (zoekpuntMarker) kaart.removeLayer(zoekpuntMarker);
      zoekpuntMarker = L.marker([pDoel.lat, pDoel.lon], {
        icon: L.divIcon({
          className: '',
          html: `<div style="background:rgba(249,115,22,.9);border:3px solid white;border-radius:50%;width:18px;height:18px;box-shadow:0 0 0 5px rgba(249,115,22,.25)"></div>`,
          iconSize: [18,18], iconAnchor: [9,9]
        })
      }).addTo(kaart).bindPopup(`🎯 Laden over ${doelKm} km`);
    }

    // Haal alle laders in de box op (max 60)
    toonLaden(`Laders ophalen in zoekzone...`);
    const ruweLaders = await haalLadersViaBoundingBox(bb, kw, 60);

    // Filter: echt langs de route + goede rijrichting, met fallback
    toonLaden(`Filteren op route...`);
    const gofilterd = filterMetFallback(ruweLaders);

    if (!gofilterd.length) {
      verbergLaden();
      toast('Geen laders langs route gevonden');
      return;
    }

    // Bereken afstand tot doelpunt voor categorisering
    const metDoelAfstand = gofilterd.map(l => ({
      ...l,
      afstandVanPunt: afstandTotRoute(l.lat, l.lon).km,
      kmOpRoute: berekenKmOpRoute(l.lat, l.lon),
    }));

    // Categoriseer op km-positie langs de route
    const eerder = metDoelAfstand.filter(l => l.kmOpRoute < doelKm - 5).sort((a,b) => b.kmOpRoute - a.kmOpRoute).slice(0,2);
    const opdoel  = metDoelAfstand.filter(l => l.kmOpRoute >= doelKm - 5 && l.kmOpRoute <= doelKm + 10).sort((a,b) => Math.abs(a.kmOpRoute-doelKm) - Math.abs(b.kmOpRoute-doelKm)).slice(0,2);
    const later   = metDoelAfstand.filter(l => l.kmOpRoute > doelKm + 10).sort((a,b) => a.kmOpRoute - b.kmOpRoute).slice(0,2);

    // Dedupliceer
    const gezien = new Set();
    function dedup(lijst) {
      return lijst.filter(l => { if(gezien.has(l.id)) return false; gezien.add(l.id); return true; });
    }
    const catEerder = dedup(eerder);
    const catDoel   = dedup(opdoel);
    const catLater  = dedup(later);

    const alleLaders = [...catEerder, ...catDoel, ...catLater];
    const metFac = await voegFaciliteitenToe(alleLaders);

    S.laders = metFac;
    S.categorieen = {
      eerder: catEerder.map(l => metFac.find(m => m.id === l.id)).filter(Boolean),
      opdoel: catDoel.map(l => metFac.find(m => m.id === l.id)).filter(Boolean),
      later:  catLater.map(l => metFac.find(m => m.id === l.id)).filter(Boolean),
      omrijd: [],
    };

    verbergLaden();
    toonLaderChipsCategorie(S.categorieen, doelKm);
    plaatsLaderMarkers(metFac, []);

    toast(`${metFac.length} laders langs route gevonden`);

  } catch(e) {
    verbergLaden();
    toast('Fout bij zoeken — controleer verbinding');
    console.error(e);
  }
}

// Bereken op hoeveel km langs de route een station ligt
function berekenKmOpRoute(lat, lon) {
  if (!S.route || S.route.length < 2) return 0;
  let gelopen = 0, minKm = Infinity, kmBijMin = 0;
  for (let i = 0; i < S.route.length - 1; i++) {
    const van = { lat: S.route[i][1], lon: S.route[i][0] };
    const naar = { lat: S.route[i+1][1], lon: S.route[i+1][0] };
    const stap = afstand(van.lat, van.lon, naar.lat, naar.lon);
    const km = afstandPuntTotSegment(lat, lon, van.lat, van.lon, naar.lat, naar.lon);
    if (km < minKm) { minKm = km; kmBijMin = gelopen + stap / 2; }
    gelopen += stap;
  }
  return kmBijMin;
}

async function voegFaciliteitenToe(laders) {
  return Promise.all(laders.map(async l => {
    const fac = await zoekFaciliteiten(l.lat, l.lon);
    return { ...l, faciliteiten: fac };
  }));
}

// ═══════════════════════════════════════════
// GEOMETRIE HULPFUNCTIES
// ═══════════════════════════════════════════

// Exacte afstand van punt (lat,lon) tot lijnstuk (A→B) in km
function afstandPuntTotSegment(pLat, pLon, aLat, aLon, bLat, bLon) {
  const dx = bLon - aLon, dy = bLat - aLat;
  const lenSq = dx*dx + dy*dy;
  if (lenSq === 0) return afstand(pLat, pLon, aLat, aLon);
  let t = ((pLon - aLon)*dx + (pLat - aLat)*dy) / lenSq;
  t = Math.max(0, Math.min(1, t));
  return afstand(pLat, pLon, aLat + t*dy, aLon + t*dx);
}

// Minimale afstand van punt tot de volledige routelijn + index dichtstbijzijnde segment
function afstandTotRoute(lat, lon) {
  if (!S.route || S.route.length < 2) return { km: 999, segIdx: 0 };
  let minKm = Infinity, minIdx = 0;
  for (let i = 0; i < S.route.length - 1; i++) {
    const km = afstandPuntTotSegment(
      lat, lon,
      S.route[i][1], S.route[i][0],
      S.route[i+1][1], S.route[i+1][0]
    );
    if (km < minKm) { minKm = km; minIdx = i; }
  }
  return { km: minKm, segIdx: minIdx };
}

// Rijrichting op segment i (graden, 0=noord, 90=oost)
function rijrichting(segIdx) {
  const i = Math.min(segIdx, S.route.length - 2);
  const dLon = S.route[i+1][0] - S.route[i][0];
  const dLat = S.route[i+1][1] - S.route[i][1];
  return Math.atan2(dLon, dLat) * 180 / Math.PI; // graden
}

// Hoek van station tov routepunt
function hoekNaarStation(segIdx, sLat, sLon) {
  const rLat = S.route[segIdx][1], rLon = S.route[segIdx][0];
  const dLon = sLon - rLon, dLat = sLat - rLat;
  return Math.atan2(dLon, dLat) * 180 / Math.PI;
}

// Zit station aan de goede kant? 
// Op snelwegen rijdt verkeer aan de rechterkant van de rijrichting.
// Stations aan de linker kant (>90° afwijking) zijn voor tegengesteld verkeer.
function goedekant(segIdx, sLat, sLon) {
  const rit = rijrichting(segIdx);
  const naar = hoekNaarStation(segIdx, sLat, sLon);
  let diff = naar - rit;
  // Normaliseer naar -180..180
  while (diff > 180) diff -= 360;
  while (diff < -180) diff += 360;
  // Rechts = positief (0..180), links = negatief
  // Station wordt weggegooid als het duidelijk links ligt (diff < -30°)
  // en ver genoeg om relevant te zijn (we checken dit alleen bij >0.3km)
  return diff > -30; // rechts of recht voor/achter = goed
}

// Bounding box over routesegment van kmVan tot kmTot
function boundingBox(kmVan, kmTot) {
  const punten = [];
  let gelopen = 0;
  for (let i = 0; i < S.route.length - 1; i++) {
    const van = { lat: S.route[i][1], lon: S.route[i][0] };
    const naar = { lat: S.route[i+1][1], lon: S.route[i+1][0] };
    const stap = afstand(van.lat, van.lon, naar.lat, naar.lon);
    if (gelopen + stap >= kmVan && gelopen <= kmTot) {
      punten.push(van, naar);
    }
    gelopen += stap;
    if (gelopen > kmTot + 10) break;
  }
  if (!punten.length) return null;
  const lats = punten.map(p => p.lat);
  const lons = punten.map(p => p.lon);
  return {
    minLat: Math.min(...lats), maxLat: Math.max(...lats),
    minLon: Math.min(...lons), maxLon: Math.max(...lons),
  };
}

// ═══════════════════════════════════════════
// NIEUWE ZOEKLOGICA MET BOUNDING BOX
// ═══════════════════════════════════════════

async function haalLadersViaBoundingBox(bb, kw, maxAantal) {
  if (!bb) return [];
  // Voeg 0.15° padding toe (~15km) aan de box
  const pad = 0.15;
  const url = `https://api.openchargemap.io/v3/poi/?output=json&maxresults=${maxAantal}`
    + `&boundingbox=(${bb.minLat-pad},${bb.minLon-pad}),(${bb.maxLat+pad},${bb.maxLon+pad})`
    + `&minpowerkw=${kw}&key=${OCM_KEY}`;
  const r = await fetch(url);
  const data = await r.json();
  if (!Array.isArray(data)) return [];
  return data.map(d => ({
    id: d.ID,
    naam: d.AddressInfo.Title,
    lat: d.AddressInfo.Latitude,
    lon: d.AddressInfo.Longitude,
    adres: [d.AddressInfo.AddressLine1, d.AddressInfo.Town].filter(Boolean).join(', '),
    aansluitingen: d.Connections ? d.Connections.length : 0,
    vermogen: d.Connections ? Math.max(...d.Connections.map(c => c.PowerKW || 0)) : 0,
    operator: d.OperatorInfo ? d.OperatorInfo.Title : 'Onbekend',
    afstandVanMij: afstand(S.positie.lat, S.positie.lon, d.AddressInfo.Latitude, d.AddressInfo.Longitude),
  }));
}

function filterOpRoute(laders, maxKm) {
  return laders
    .map(l => {
      const { km, segIdx } = afstandTotRoute(l.lat, l.lon);
      return { ...l, afstandVanRoute: km, segIdx };
    })
    .filter(l => {
      if (l.afstandVanRoute > maxKm) return false;
      // Rijrichtingcheck: alleen toepassen als station verder dan 300m van route
      if (l.afstandVanRoute > 0.3 && !goedekant(l.segIdx, l.lat, l.lon)) return false;
      return true;
    });
}

function filterMetFallback(laders) {
  // Probeer 1km, dan 2km, dan 5km
  for (const maxKm of [1, 2, 5]) {
    const resultaat = filterOpRoute(laders, maxKm);
    if (resultaat.length > 0) {
      if (maxKm > 1) toast(`Binnen ${maxKm} km van route gevonden`);
      return resultaat;
    }
  }
  return [];
}

async function haalLadersOpPunt(punt, maxKm, kw, maxAantal) {
  if (!punt) return [];
  try {
    const url = `https://api.openchargemap.io/v3/poi/?output=json&maxresults=${maxAantal}&latitude=${punt.lat}&longitude=${punt.lon}&distance=${maxKm}&distanceunit=KM&minpowerkw=${kw}&key=${OCM_KEY}`;
    const r = await fetch(url);
    const data = await r.json();
    return data.map(d => ({
      id: d.ID,
      naam: d.AddressInfo.Title,
      lat: d.AddressInfo.Latitude,
      lon: d.AddressInfo.Longitude,
      adres: [d.AddressInfo.AddressLine1, d.AddressInfo.Town].filter(Boolean).join(', '),
      aansluitingen: d.Connections ? d.Connections.length : 0,
      vermogen: d.Connections ? Math.max(...d.Connections.map(c => c.PowerKW || 0)) : 0,
      operator: d.OperatorInfo ? d.OperatorInfo.Title : 'Onbekend',
      afstandVanPunt: afstand(punt.lat, punt.lon, d.AddressInfo.Latitude, d.AddressInfo.Longitude),
      afstandVanMij: afstand(S.positie.lat, S.positie.lon, d.AddressInfo.Latitude, d.AddressInfo.Longitude),
    }));
  } catch(e) { return []; }
}

async function zoekFaciliteiten(lat, lon) {
  try {
    const query = `[out:json][timeout:10];
(
  node["amenity"="fast_food"](around:500,${lat},${lon});
  node["amenity"="restaurant"](around:500,${lat},${lon});
  node["amenity"="toilets"](around:500,${lat},${lon});
  node["shop"="supermarket"](around:500,${lat},${lon});
  node["shop"="convenience"](around:500,${lat},${lon});
  node["amenity"="fuel"](around:500,${lat},${lon});
);
out body;`;
    const r = await fetch('https://overpass-api.de/api/interpreter', {
      method: 'POST',
      body: 'data=' + encodeURIComponent(query)
    });
    const data = await r.json();
    const facs = [];
    for (const el of data.elements.slice(0, 8)) {
      const naam = el.tags.name || el.tags.amenity || el.tags.shop || '';
      const type = el.tags.amenity || el.tags.shop || '';
      const dist_m = Math.round(afstand(lat, lon, el.lat, el.lon) * 1000);
      const icon = facilityIcon(type, naam);
      facs.push({ naam, type, dist_m, icon });
    }
    return facs;
  } catch(e) {
    return [];
  }
}

function facilityIcon(type, naam) {
  const n = naam.toLowerCase();
  if (n.includes('mcdonald') || n.includes('burger') || n.includes('kfc')) return '🍔';
  if (n.includes('aldi') || n.includes('lidl') || n.includes('jumbo') || n.includes('ah')) return '🛒';
  if (type === 'toilets') return '🚽';
  if (type === 'fast_food') return '🍟';
  if (type === 'restaurant') return '🍽️';
  if (type === 'fuel') return '⛽';
  if (type === 'supermarket' || type === 'convenience') return '🛒';
  return '📍';
}

function toonDetail(i) {

    </div>

    <div class="panel-sectie">
      <div class="panel-sectie-titel">Faciliteiten in de buurt</div>
      ${facHtml}
    </div>

    <div class="panel-sectie">
      <div class="voor-nadeel-grid">
        <div class="voordelen">
          <div class="vn-titel">✅ Voordelen</div>
          ${voordelen.map(v => `<div class="vn-item">• ${v}</div>`).join('')}
        </div>
        <div class="nadelen">
          <div class="vn-titel">⚠️ Nadelen</div>
          ${nadelen.map(n => `<div class="vn-item">• ${n}</div>`).join('')}
        </div>
      </div>
    </div>

    <div class="panel-knoppen">
      <button class="panel-btn navigeer" onclick="navigeerNaarLader()">🗺️ Navigeer</button>
      <button class="panel-btn plugshare" onclick="openPlugshare()">📱 Live status</button>
    </div>
  `;

  document.getElementById('overlay').classList.add('zichtbaar');
  document.getElementById('detail-panel').classList.add('open');

  if (kaart) kaart.setView([l.lat, l.lon], 14);
}

function bepaalVoordelen(l) {
  const v = [];
  const afst = l.afstandVanMij ?? l.afstand ?? 99;
  if (l.vermogen >= 150) v.push(`Snel laden: ${Math.round(l.vermogen)} kW`);
  else if (l.vermogen >= 100) v.push('100 kW+ snelladen');
  if (l.aansluitingen >= 8) v.push('Veel aansluitingen');
  if (l.faciliteiten?.some(f => f.type === 'fast_food' || f.naam?.toLowerCase().includes('mcdonald'))) v.push('Fast food aanwezig');
  if (l.faciliteiten?.some(f => f.type === 'toilets')) v.push('Toilet aanwezig');
  if (l.faciliteiten?.some(f => f.type === 'supermarket' || f.type === 'convenience')) v.push('Supermarkt nabij');
  if (afst < 1) v.push('Dicht bij jou');
  if (!v.length) v.push('Op de route');
  return v;
}

function bepaalNadelen(l) {
  const n = [];
  const afst = l.afstandVanMij ?? l.afstand ?? 0;
  if (l.vermogen < 50) n.push('Laag vermogen (AC)');
  else if (l.vermogen < 100) n.push('Max 50 kW');
  if (l.aansluitingen <= 2) n.push('Weinig aansluitingen');
  if (!l.faciliteiten?.length) n.push('Geen faciliteiten nabij');
  if (afst > 10) n.push('Flinke omrijafstand');
  if (!n.length) n.push('Geen bekende nadelen');
  return n;
}

// ═══════════════════════════════════════════
// HULPFUNCTIES
// ═══════════════════════════════════════════

function afstand(lat1, lon1, lat2, lon2) {
  const R = 6371;
  const dLat = (lat2 - lat1) * Math.PI / 180;
  const dLon = (lon2 - lon1) * Math.PI / 180;
  const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180) * Math.cos(lat2*Math.PI/180) * Math.sin(dLon/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

function setStatus(type, tekst) {
  const dot = document.getElementById('status-dot');
  dot.className = 'status-dot ' + type;
  document.getElementById('status-tekst').textContent = tekst;
}

function toonLaden(tekst) {

  document.getElementById('laden').classList.add('zichtbaar');
}
function verbergLaden() {

}

let toastTimer = null;
function toast(tekst) {
  const el = document.getElementById('toast');
  el.textContent = tekst;
  el.classList.add('zichtbaar');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('zichtbaar'), 2800);
}
